name: 3-4

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- akun-3 ---
          - path: 'akun-3/akun-3'
          - path: 'akun-3/akun-3_2'
          - path: 'akun-3/akun-3_3'
          - path: 'akun-3/akun-3_4'
          - path: 'akun-3/akun-3_5'

          # --- akun-4 ---
          - path: 'akun-4/akun-4'
          - path: 'akun-4/akun-4_2'
          - path: 'akun-4/akun-4_3'
          - path: 'akun-4/akun-4_4'
          - path: 'akun-4/akun-4_5'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
        TARGET_PATH: ${{ matrix.path }}
      run: python download_drive.py

    - name: Run Bot Script with Auto-Restart
      run: |
        cd ${{ matrix.path }}
        until python3 seofast_zhp.py; do
          echo "[!] Bot di ${{ matrix.path }} terhenti/crash (Exit Code: $?). Merestart bot dalam 5 detik..."
          sleep 5
        done
