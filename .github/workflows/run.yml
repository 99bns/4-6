name: 4-6

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- akun-4 ---
          - path: 'akun-4/akun-4'
          - path: 'akun-4/akun-4_2'
          - path: 'akun-4/akun-4_3'
          - path: 'akun-4/akun-4_4'
          - path: 'akun-4/akun-4_5'

          # --- akun-5 ---
          - path: 'akun-5/akun-5'
          - path: 'akun-5/akun-5_2'
          - path: 'akun-5/akun-5_3'
          - path: 'akun-5/akun-5_4'
          - path: 'akun-5/akun-5_5'

          # --- akun-6 ---
          - path: 'akun-6/akun-6'
          - path: 'akun-6/akun-6_2'
          - path: 'akun-6/akun-6_3'
          - path: 'akun-6/akun-6_4'
          - path: 'akun-6/akun-6_5'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python download_drive.py

    - name: Run Bot Script
      run: |
        cd ${{ matrix.path }}
        python3 seofast_zhp.py
