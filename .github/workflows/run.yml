name: "4-6"

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google API Client
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python download_drive.py

    - name: Scan Folders Dynamically
      id: set-matrix
      run: |
        python -c "
        import os, json

        targets = ['akun-4', 'akun-5', 'akun-6']
        paths = []

        for target in targets:
            if os.path.exists(target):
                for root, dirs, files in os.walk(target):
                    if 'seofast_zhp.py' in files:
                        paths.append(root)

        print('Path ditemukan:', paths)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'matrix={json.dumps(paths)}\n')
        "

  run-bot:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python download_drive.py

    - name: Run Bot Script
      run: |
        cd ${{ matrix.path }}
        python3 seofast_zhp.py
