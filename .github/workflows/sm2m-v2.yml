name: "sm2m-v2"

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

concurrency:
  group: emjuh-workflow-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: ['71', '71b']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome & Rclone System
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl rclone fuse3 google-chrome-stable
        sudo rm -f /usr/bin/chromedriver

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium selenium-stealth colorama certifi urllib3

    - name: Setup & Mount Folder SF (Real-time Stream)
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: |
        mkdir -p /home/runner/.config/rclone

        python3 -c "
        import os, json, re, sys

        raw_key = os.environ.get('GCP_SA_KEY', '').strip()
        sa_path = '/home/runner/.config/rclone/sa.json'

        print('===> [DEBUG] Mengecek format GCP_SA_KEY...')
        
        # Validasi 1: Cek apakah Secret GCP_SA_KEY berisi Path bukannya JSON
        if raw_key.startswith('/'):
            print(f'[!] ERROR PARSING: GCP_SA_KEY terdeteksi berisi PATH/STRING ({raw_key[:20]}...), bukan isi file JSON!')
            print('[!] Harap buka Settings > Secrets > GCP_SA_KEY, hapus runs/path-nya, lalu PASTE SELURUH ISI FILE JSON-nya.')
            sys.exit(1)

        # Validasi 2: Parse JSON
        try:
            parsed_json = json.loads(raw_key)
            with open(sa_path, 'w') as f:
                json.dump(parsed_json, f)
            print('[+] BERHASIL: sa.json valid dan berhasil ditulis.')
        except Exception as e:
            print(f'[!] ERROR JSON PARSE: {e}')
            print(f'[!] 50 karakter pertama dari GCP_SA_KEY: {repr(raw_key[:50])}')
            sys.exit(1)

        # Clean DRIVE_FILE_ID
        raw_id = os.environ.get('DRIVE_FILE_ID', '').strip()
        match = re.search(r'([a-zA-Z0-9_-]{25,})', raw_id)
        clean_id = match.group(1) if match else raw_id

        rclone_conf = f'''[gdrive]
type = drive
scope = drive
service_account_credentials = {sa_path}
root_folder_id = {clean_id}
'''
        with open('/home/runner/.config/rclone/rclone.conf', 'w') as f:
            f.write(rclone_conf)
            
        print(f'[+] Config Rclone beres dengan Root ID: {clean_id}')
        "

        mkdir -p ./drive_sf
        rclone mount gdrive: ./drive_sf --vfs-cache-mode writes --allow-other --daemon
        sleep 5

    - name: Run All Subfolder Bots In Parallel
      run: |
        python3 -c "
        import os, subprocess

        target_dir = os.path.join('./drive_sf', '${{ matrix.target }}')
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 sm.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target_dir):
            for root, dirs, files in os.walk(target_dir):
                if 'sm.py' in files:
                    print(f'==> Menjalankan Bot Real-time di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target_dir} tidak ditemukan di Google Drive!')
            exit(1)
        "
