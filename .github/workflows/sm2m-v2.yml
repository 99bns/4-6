name: "sm2m-v2"

on:
  workflow_dispatch:

concurrency:
  group: emjuh-workflow-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: ['71', '71b']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome & Rclone System
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl rclone fuse3 google-chrome-stable
        sudo rm -f /usr/bin/chromedriver

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium selenium-stealth colorama certifi urllib3

    - name: Setup & Mount Folder SF
      env:
        RAW_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        RAW_DRIVE_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: |
        mkdir -p /home/runner/.config/rclone

        python3 -c "
        import os, json, re

        # Read environment variables directly
        key_data = os.environ.get('RAW_GCP_KEY', '')
        
        # Parse JSON and fix double-escaped newlines in private_key
        try:
            parsed = json.loads(key_data)
        except Exception:
            # Handle case where newlines are literal \n strings
            key_data_clean = key_data.replace('\\\\n', '\\n')
            parsed = json.loads(key_data_clean)

        if 'private_key' in parsed:
            parsed['private_key'] = parsed['private_key'].replace('\\n', '\n')

        # Save sanitized JSON to file
        sa_path = '/home/runner/.config/rclone/sa.json'
        with open(sa_path, 'w', encoding='utf-8') as f:
            json.dump(parsed, f, indent=2)

        # Sanitize Drive Folder ID
        raw_id = os.environ.get('RAW_DRIVE_ID', '').strip()
        match = re.search(r'([a-zA-Z0-9_-]{25,})', raw_id)
        clean_id = match.group(1) if match else raw_id

        # Generate rclone config
        rclone_conf = f'''[gdrive]
type = drive
scope = drive
service_account_credentials = {sa_path}
root_folder_id = {clean_id}
'''
        with open('/home/runner/.config/rclone/rclone.conf', 'w', encoding='utf-8') as f:
            f.write(rclone_conf)

        print('[+] sa.json & rclone.conf successfully written and formatted.')
        "

        mkdir -p ./drive_sf
        rclone mount gdrive: ./drive_sf --vfs-cache-mode writes --allow-other --daemon
        sleep 5

    - name: Run All Subfolder Bots In Parallel
      run: |
        python3 -c "
        import os, subprocess

        target_dir = os.path.join('./drive_sf', '${{ matrix.target }}')
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 sm.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target_dir):
            for root, dirs, files in os.walk(target_dir):
                if 'sm.py' in files:
                    print(f'==> Menjalankan Bot Real-time di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target_dir} tidak ditemukan di Google Drive!')
            exit(1)
        "
