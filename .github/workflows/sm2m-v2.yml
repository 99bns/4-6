name: "sm2m-v2"

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

concurrency:
  group: emjuh-workflow-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      # KUNCI EDIT DILAKUKAN DI SINI (Ubah nama folder di Drive sesuai kebutuhan):
      matrix:
        target: ['71', '71b']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome & Rclone System
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl rclone fuse3 google-chrome-stable
        sudo rm -f /usr/bin/chromedriver

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium selenium-stealth colorama certifi urllib3

    - name: Setup & Mount Folder SF (Real-time Stream)
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: |
        mkdir -p /home/runner/.config/rclone

        python3 -c "
        import os, json, re

        # 1. Tulis sa.json secara MENTAH (mencegah eror escape slash / character)
        raw_key = os.environ.get('GCP_SA_KEY', '')
        try:
            # Jika ter-escape, parse dulu baru dump
            parsed_key = json.loads(raw_key)
            with open('/home/runner/.config/rclone/sa.json', 'w') as f:
                json.dump(parsed_key, f)
        except Exception:
            # Jika mentah, tulis langsung
            with open('/home/runner/.config/rclone/sa.json', 'w') as f:
                f.write(raw_key)

        # 2. Extract Folder ID bersih dari secret DRIVE_FILE_ID
        raw_id = os.environ.get('DRIVE_FILE_ID', '').strip()
        match = re.search(r'([a-zA-Z0-9_-]{25,})', raw_id)
        clean_id = match.group(1) if match else raw_id

        # 3. Buat rclone.conf
        rclone_conf = f'''[gdrive]
type = drive
scope = drive
service_account_credentials = /home/runner/.config/rclone/sa.json
root_folder_id = {clean_id}
'''
        with open('/home/runner/.config/rclone/rclone.conf', 'w') as f:
            f.write(rclone_conf)

        print(f'[+] Config Rclone beres! Root ID: {clean_id}')
        "

        mkdir -p ./drive_sf
        rclone mount gdrive: ./drive_sf --vfs-cache-mode writes --allow-other --daemon
        sleep 5

    - name: Run All Subfolder Bots In Parallel
      run: |
        python3 -c "
        import os, subprocess

        # Otomatis mengambil target dari matrix GitHub Actions
        target_dir = os.path.join('./drive_sf', '${{ matrix.target }}')
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 sm.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target_dir):
            for root, dirs, files in os.walk(target_dir):
                if 'sm.py' in files:
                    print(f'==> Menjalankan Bot Real-time di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target_dir} tidak ditemukan di Google Drive!')
            exit(1)
        "
